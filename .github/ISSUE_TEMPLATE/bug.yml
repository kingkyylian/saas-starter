name: Bug
description: Report incorrect behavior, a regression, or a production risk.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken? Include expected and actual behavior.
      placeholder: "Expected: ...\nActual: ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands or steps needed to reproduce the issue.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, stack traces, failing tests, or relevant file/line references.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, package manager, database provider, auth provider, and deployment target.
      placeholder: "Node 22, npm 10, SQLite locally, GitHub OAuth, Vercel"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for the fix to be complete?
      placeholder: "- [ ] ..."
    validations:
      required: true
